for(var k=0;k<=w;k++){var gx=-10+20*k/w,gy=py(fun(gx));if(!Number.isFinite(gy)||Math.abs(gy)>h*3){drawing=false;continue;}if(!drawing){ctx.moveTo(k,gy);drawing=true;}else ctx.lineTo(k,gy);}ctx.stroke();
}
function toast(msg){var old=document.querySelector('.toast');if(old)old.remove();var d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(function(){d.remove();},2300);}
function copyText(s){if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(s);var el=document.createElement('textarea');el.value=s;el.style.position='fixed';el.style.opacity='0';document.body.appendChild(el);el.select();var ok=document.execCommand('copy');el.remove();return ok?Promise.resolve():Promise.reject(new Error('Clipboard không khả dụng'));}
document.addEventListener('click',function(e){
var b=e.target.closest('button');if(!b)return;
if(b.dataset.view){state.page=b.dataset.view;state.query='';state.cat='all';search.value='';show(state.page);return;}
if(b.dataset.category){state.cat=b.dataset.category;state.page='formulas';state.query='';search.value='';render();return;}
if(b.dataset.tool){state.tool=b.dataset.tool;state.page='tools';state.query='';search.value='';render();return;}
if(b.dataset.grade){state.grade=b.dataset.grade;state.page='formulas';render();return;}
if(b.dataset.cat){state.cat=b.dataset.cat;render();return;}
if(b.dataset.reset){state.cat='all';state.grade='all';state.query='';search.value='';render();return;}
if(b.dataset.fav!==undefined){var id=Number(b.dataset.fav),p=state.favs.indexOf(id);if(p===-1)state.favs.push(id);else state.favs.splice(p,1);try{localStorage.setItem('mathlab-favs-v1',JSON.stringify(state.favs));}catch(e){}render();return;}
if(b.dataset.copy!==undefined){var f=formulas[Number(b.dataset.copy)];copyText(f.title+'\n'+f.expr+'\n'+f.note).then(function(){toast('Đã sao chép công thức');}).catch(function(){toast('Không thể sao chép');});}
});
document.getElementById('side-grades').innerHTML=['all','6','7','8','9','10','11','12'].map(function(g){return '<button data-grade="'+g+'" class="'+(g==='all'?'active':'')+'">'+(g==='all'?'Tất cả lớp':g)+'</button>';}).join('');
search.addEventListener('input',function(){state.query=search.value;if(state.page==='home')state.page='formulas';render();});
document.addEventListener('keydown',function(e){if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();search.focus();}});
render();
})();
